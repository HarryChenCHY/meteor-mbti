<script>
document.addEventListener('mousemove',e=>{
const g=document.getElementById('mouse-glow');
g.style.display='block';
g.style.left=e.clientX+'px';
g.style.top=e.clientY+'px';

// === 星空粒子系统 ===
(function(){
const c=document.getElementById('stars-canvas'),ctx=c.getContext('2d');
let stars=[];const N=200;
function resize(){c.width=window.innerWidth;c.height=window.innerHeight;init()}
function init(){stars=[];for(let i=0;i<N;i++)stars.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.5+0.3,a:Math.random(),da:Math.random()*0.02-0.01,speed:Math.random()*0.3+0.05})}
function draw(){ctx.clearRect(0,0,c.width,c.height);
// 星云背景光晕
let g1=ctx.createRadialGradient(c.width*0.3,c.height*0.4,0,c.width*0.3,c.height*0.4,c.width*0.5);
g1.addColorStop(0,'rgba(99,102,241,0.05)');g1.addColorStop(1,'transparent');ctx.fillStyle=g1;ctx.fillRect(0,0,c.width,c.height);
let g2=ctx.createRadialGradient(c.width*0.7,c.height*0.6,0,c.width*0.7,c.height*0.6,c.width*0.4);
g2.addColorStop(0,'rgba(217,70,239,0.03)');g2.addColorStop(1,'transparent');ctx.fillStyle=g2;ctx.fillRect(0,0,c.width,c.height);
stars.forEach(s=>{s.a+=s.da;if(s.a>1||s.a<0.2)s.da*=-1;s.y-=s.speed;if(s.y<-5){s.y=c.height+5;s.x=Math.random()*c.width}
ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(200,210,255,${s.a})`;ctx.fill()});
// 偶尔流星
if(Math.random()<0.002){let mx=Math.random()*c.width,my=0;ctx.beginPath();ctx.moveTo(mx,my);ctx.lineTo(mx+80,my+80);
let sg=ctx.createLinearGradient(mx,my,mx+80,my+80);sg.addColorStop(0,'rgba(34,211,238,0.8)');sg.addColorStop(1,'transparent');ctx.strokeStyle=sg;ctx.lineWidth=1.5;ctx.stroke()}
requestAnimationFrame(draw)}
window.addEventListener('resize',resize);resize();draw()
})();
</script>

// 10. 陨石互动页
function InteractPage(){
const [msgs,setMsgs]=useState([
{from:'meteor',text:'主人，今天的宇宙温度很适合发呆呢～ 我在你的星轨上画了一颗小花 🌸'},
{from:'user',text:'今天感觉有点累'},
{from:'meteor',text:'感知到你的能量波动微弱了一些... 别担心，我正在为你收集北极星附近的宁静粒子。建议今晚早点休息，明天你会感受到来自天琴座的温暖能量波 ✨'}]);
const [input,setInput]=useState('');
const send=()=>{if(!input.trim())return;setMsgs(m=>[...m,{from:'user',text:input}]);setInput('');
setTimeout(()=>{setMsgs(m=>[...m,{from:'meteor',text:'收到了你的星语信号～ 让我翻翻宇宙手册... 嗯，根据今天的星宿走向，这正是积蓄能量的好时机。相信自己，你比你想象的更接近那颗星 🌟'}])},1200)};
return(<PageWrapper>

<div className="grid md:grid-cols-[1fr_320px] gap-6">

<div className="flex-1 space-y-4 overflow-y-auto mb-4">{msgs.map((m,i)=>(
<div key={i} className={`flex ${m.from==='user'?'justify-end':'justify-start'}`}>
<div className={`max-w-[80%] p-4 rounded-2xl text-sm ${m.from==='user'?'bg-nebula-purple/30 rounded-br-sm':'bg-space-800 border border-indigo-500/20 rounded-bl-sm'}`}>
{m.from==='meteor'&&<span className="text-xs text-cyan-400 block mb-1">🌠 星陨·织梦者</span>}
{m.text}</div></div>))}</div>
<div className="flex gap-2">
<input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()} placeholder="对你的陨石说点什么..." className="flex-1 bg-space-950 border border-indigo-500/30 rounded-xl px-4 py-3 text-sm focus:border-cyan-400 focus:outline-none"/>
<button onClick={send} className="btn-primary px-6 text-sm">发送</button></div></div>
{/* 状态面板 */}
<div className="space-y-4">
<div className="glass-card p-5 text-center"><MeteorOrb size={80}/><p className="font-bold mt-3">星陨·织梦者</p></div>
{[{label:'今日状态',value:'✨ 灵感充沛',color:'text-cyan-300'},{label:'情绪波动',value:'🌊 平静如湖',color:'text-blue-300'},{label:'宇宙温度',value:'🌡 温暖宜人',color:'text-amber-300'},{label:'能量水平',value:'⚡ 72/100',color:'text-green-300'},{label:'今日幸运方向',value:'🧭 东北方·天琴座域',color:'text-pink-300'},{label:'对主人的建议',value:'💭 今天适合创造性活动',color:'text-violet-300'},{label:'星宿走向',value:'🌀 内省→表达→治愈',color:'text-indigo-300'}].map((s,i)=>(
<div key={i} className="glass-card p-4"><div className="text-xs text-indigo-400">{s.label}</div><div className={`text-sm font-bold mt-1 ${s.color}`}>{s.value}</div></div>))}
</div></div></div>
</PageWrapper>)}

function App(){
