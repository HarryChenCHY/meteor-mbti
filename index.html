// === 星空粒子系统 ===
(function(){
const c=document.getElementById('stars-canvas'),ctx=c.getContext('2d');
let stars=[];const N=200;
function resize(){c.width=window.innerWidth;c.height=window.innerHeight;init()}
function init(){stars=[];for(let i=0;i<N;i++)stars.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.5+0.3,a:Math.random(),da:Math.random()*0.02-0.01,speed:Math.random()*0.3+0.05})}
function draw(){ctx.clearRect(0,0,c.width,c.height);
let g1=ctx.createRadialGradient(c.width*0.3,c.height*0.4,0,c.width*0.3,c.height*0.4,c.width*0.5);
g1.addColorStop(0,'rgba(99,102,241,0.05)');g1.addColorStop(1,'transparent');ctx.fillStyle=g1;ctx.fillRect(0,0,c.width,c.height);
let g2=ctx.createRadialGradient(c.width*0.7,c.height*0.6,0,c.width*0.7,c.height*0.6,c.width*0.4);
g2.addColorStop(0,'rgba(217,70,239,0.03)');g2.addColorStop(1,'transparent');ctx.fillStyle=g2;ctx.fillRect(0,0,c.width,c.height);
stars.forEach(s=>{s.a+=s.da;if(s.a>1||s.a<0.2)s.da*=-1;s.y-=s.speed;if(s.y<-5){s.y=c.height+5;s.x=Math.random()*c.width}
ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(200,210,255,${s.a})`;ctx.fill()});
if(Math.random()<0.002){let mx=Math.random()*c.width,my=0;ctx.beginPath();ctx.moveTo(mx,my);ctx.lineTo(mx+80,my+80);
let sg=ctx.createLinearGradient(mx,my,mx+80,my+80);sg.addColorStop(0,'rgba(34,211,238,0.8)');sg.addColorStop(1,'transparent');ctx.strokeStyle=sg;ctx.lineWidth=1.5;ctx.stroke()}
requestAnimationFrame(draw)}
window.addEventListener('resize',resize);resize();draw()
})();
</script>

function QuizPage({onNavigate,onAddEnergy}){
const [qi,setQi]=useState(0);
const [score,setScore]=useState(0);
const [chosen,setChosen]=useState(null);
const [streak,setStreak]=useState(0);
const [finished,setFinished]=useState(false);
const q=MOCK_QUIZ[qi];
const answer=(i)=>{
setChosen(i);
if(i===q.ans){setScore(s=>s+20);setStreak(s=>s+1);onAddEnergy(20)}
else{setStreak(0)}
setTimeout(()=>{
setChosen(null);
const next=qi+1;
if(next>=MOCK_QUIZ.length){setFinished(true)}
else{setQi(next)}
},1200)};
if(finished)return(<PageWrapper>

<div className="flex gap-3 justify-center flex-wrap">

<button onClick={()=>onNavigate('shop')} className="btn-outline">去兑换奖品 🎁</button>
<button onClick={()=>onNavigate('cultivate')} className="text-xs text-indigo-400 hover:text-cyan-300 underline underline-offset-4">查看陨石成长</button>
</div>
</div>
</PageWrapper>);
return(<PageWrapper>
<div className="max-w-2xl mx-auto px-6 py-16">
<div className="flex items-start justify-between mb-8 gap-4">
<SectionTitle title="天文知识挑战" sub={`第 ${qi+1} 题 / 共 ${MOCK_QUIZ.length} 题`}/>
<div className="text-right shrink-0">
<div className="text-xs text-indigo-400">本轮得分</div>
<div className="text-2xl font-bold text-cyan-300">{score}</div>
{streak>=2&&<div className="text-xs text-amber-400 mt-1">🔥 连续答对 {streak}</div>}
</div></div>
<div className="glass-card p-8">
<div className="flex items-center gap-3 mb-6"><MeteorOrb size={40} animate={false}/><span className="text-xs text-indigo-400">正在喂养：星陨·织梦者 · 答对 +20 ⚡</span></div>
<h3 className="text-xl font-bold mb-6">{q.q}</h3>
<div className="space-y-3">{q.opts.map((o,i)=>{
let cls='glass-card p-4 cursor-pointer text-sm transition-all w-full text-left ';
if(chosen!==null){if(i===q.ans)cls+='border-green-400 bg-green-400/10 text-green-300';else if(i===chosen)cls+='border-red-400 bg-red-400/10 text-red-300';else cls+='opacity-40'}
else cls+='hover:border-cyan-400/40';
return <button key={i} onClick={()=>chosen===null&&answer(i)} className={cls}>{o}</button>})}</div>
{chosen!==null&&<div className={`mt-4 text-sm text-center ${chosen===q.ans?'text-green-300':'text-red-300'}`}>{chosen===q.ans?'✨ 正确！+20 星星能量':'💫 加油，下次一定！'}</div>}
</div>
<div className="mt-6 flex justify-center">
<div className="flex gap-1">{MOCK_QUIZ.map((_,i)=>(
<div key={i} className={`w-2 h-2 rounded-full transition-all ${i<qi?'bg-cyan-400':i===qi?'bg-white':'bg-indigo-700'}`}/>))}</div>
</div>
</div>
</PageWrapper>)}

// ========== 主应用 ==========
function App(){
const [page,setPage]=useState('home');
const [moreOpen,setMoreOpen]=useState(false);
const [energy,setEnergy]=useState(62);
const navigate=(p)=>{setPage(p);setMoreOpen(false);window.scrollTo({top:0,behavior:'smooth'})};
const addEnergy=(n)=>setEnergy(e=>e+n);
const spendEnergy=(n)=>setEnergy(e=>Math.max(e-n,0));
return(<>
<MobileTopBar page={page}/>
<Navbar current={page} onNavigate={navigate}/>
<MoreMenuSheet open={moreOpen} onClose={()=>setMoreOpen(false)} onNavigate={navigate} current={page}/>
{page==='home'&&<HomePage onNavigate={navigate} energy={energy}/>}
{page==='create'&&<CreatePage onNavigate={navigate}/>}
{page==='generating'&&<GeneratingPage onNavigate={navigate}/>}
{page==='result'&&<ResultPage onNavigate={navigate}/>}
{page==='archive'&&<ArchivePage onNavigate={navigate} energy={energy}/>}
{page==='cultivate'&&<CultivatePage onNavigate={navigate} energy={energy} onAddEnergy={addEnergy}/>}
{page==='quiz'&&<QuizPage onNavigate={navigate} onAddEnergy={addEnergy}/>}
{page==='shop'&&<ShopPage onNavigate={navigate} energy={energy} onSpendEnergy={spendEnergy}/>}
<GlobalFooter/>
<MobileTabBar current={page} onNavigate={navigate} moreOpen={moreOpen} setMoreOpen={setMoreOpen}/>
</>)}

ReactDOM.createRoot(document.getElementById('app')).render(<App/>);
</script>
</body>
